# Local development infrastructure.
#
# Host ports are deliberately unusual so this stack can run alongside any other
# Postgres/Redis you already have. Container-internal ports stay standard.
name: kidslearn

services:
  postgres:
    image: postgres:16-alpine
    container_name: kidslearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kidslearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kidslearn_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kidslearn}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kidslearn} -d ${POSTGRES_DB:-kidslearn}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kidslearn]

  redis:
    image: redis:7-alpine
    container_name: kidslearn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kidslearn]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: kidslearn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kidslearn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kidslearn_dev_secret}
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kidslearn]

  # Creates the bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: kidslearn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-kidslearn} ${S3_SECRET_KEY:-kidslearn_dev_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-kidslearn} &&
      mc anonymous set download local/${S3_BUCKET:-kidslearn} &&
      echo 'bucket ready'
      "
    networks: [kidslearn]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  kidslearn:
    driver: bridge
